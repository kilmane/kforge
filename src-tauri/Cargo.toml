[package]
name = "kforge"
version = "0.1.4"
description = "KForge"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

tauri-plugin-shell = "2"


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Secure credential storage (OS keyring)
# NOTE: keyring has NO default features; without a platform feature it falls back to the mock store.
# We add platform features in target-specific dependency sections below.
keyring = "3"

# Error handling
thiserror = "2"

# HTTP clients
# - blocking preserves the existing AI-provider clients
# - rustls keeps Windows builds independent from a system OpenSSL install
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Official Model Context Protocol Rust SDK. The Supabase Autopilot adapter uses
# only its OAuth and Streamable HTTP client surfaces.
rmcp = { version = "3.1.0", default-features = false, features = ["auth", "client", "transport-streamable-http-client-reqwest"] }

# Temporary loopback OAuth callback listener.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"

# Tauri v2 plugins
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# --- Platform-specific keyring backends ---
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3.24.0"

[features]
# this is used for production builds or when a dev server is not specified, DO NOT REMOVE
custom-protocol = ["tauri/custom-protocol"]
